function toAppCategory(raw) {
  if (raw === "Hair") return "hair";
  if (raw === "Bath & Body") return "body";
  return "skincare";
}

const PRODUCTS = RAW_PRODUCTS.map((p) => ({
  ...p,
  category: toAppCategory(p.categoryRaw),
}));

/* ---------------- Real backend connection ----------------
   Point this at the running Express+SQLite server (see the
   glowtive-backend folder / its README). When that server is
   reachable, every call below hits real SQL. If it's not running
   (e.g. previewing this artifact on its own), each call falls back
   to the local in-memory logic further down so the demo still works. */
const API_BASE = "";

async function apiCall(path, options) {
  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
  } catch (networkErr) {
    // Backend unreachable (not running, wrong URL, CORS, offline, etc.)
    const err = new Error("Can't reach the Glowtive server");
    err.isNetworkError = true;
    throw err;
  }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    const err = new Error(body.error || `Request failed (${res.status})`);
    err.isServerError = true;
    throw err;
  }
  return res.json();
}

/* ---------------- AIEngine (mirrors the class diagram) ---------------- */
const AIEngine = {
  analyzeIngredients(product) {
    return product.ingredients;
  },
  matchAllergens(ingredients, allergyList) {
    return ingredients.find((ing) => allergyList.includes(ing)) || null;
  },
  checkProductSafety(product, allergyList) {
    const flagged = AIEngine.matchAllergens(
      AIEngine.analyzeIngredients(product),
      allergyList
    );
    return { safe: !flagged, flagged };
  },
  getSuitableAlternatives(product, allergyList, categoryFilter) {
    return PRODUCTS.filter((p) => {
      if (p.id === product.id) return false;
      if (p.category !== product.category) return false;
      if (categoryFilter && categoryFilter !== "all") {
        if (categoryFilter === "organic" && !p.organic) return false;
      }
      return AIEngine.checkProductSafety(p, allergyList).safe;
    });
  },
};

      return (<svg {...common}><rect x="3" y="7" width="18" height="13" rx="2" /><path d="M8 7l1.6-2.4A1 1 0 0 1 10.4 4h3.2a1 1 0 0 1 .8.6L16 7" /><circle cx="12" cy="13.5" r="3.2" /></svg>);
    case "gallery":
      return (<svg {...common}><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="8.5" cy="9.5" r="1.6" /><path d="M21 16l-5.5-5.5a1 1 0 0 0-1.4 0L6 18.5" /></svg>);
    case "warning":
      return (<svg {...common} stroke={T.warnText}><path d="M12 3l10 18H2L12 3Z" /><path d="M12 10v4" /><path d="M12 17.2v.1" /></svg>);
    case "filter":
      return (<svg {...common}><path d="M4 6h16M7 12h10M10 18h4" /></svg>);
    case "sortOrPlus":
      return (<svg {...common} strokeWidth="2.2"><path d="M12 5v14M5 12h14" /></svg>);
    case "check":
      return (<svg {...common} stroke={T.greenText}><path d="M5 12l4 4 10-10" /></svg>);
    case "signout":
      return (<svg {...common}><path d="M9 6V5a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-1" /><path d="M3 12h11M11 8l4 4-4 4" /></svg>);
    default:
      return null;
  }
}

      setError("Please enter letters only");
      return;

    setError("");
    const normalized = val.toLowerCase();

    setDraft("");
    if (user?.phone) {
      try {
        await apiCall(`/api/allergies/${user.phone}`, { method: "POST", body: JSON.stringify({ allergyName: normalized }) });

function Scan({ go, setActiveProduct, category }) {
  const [phase, setPhase] = useState("idle"); // idle | viewfinder | invalidFramed | invalidAlert | analyzing

  const startCapture = () => setPhase("viewfinder");

  const confirmShot = (valid) => {
    if (!valid) { setPhase("invalidFramed"); return; }
    setPhase("analyzing");
    (async () => {
      try {
        const product = await apiCall("/api/scan", { method: "POST", body: JSON.stringify({ category, imageValid: true }) });
        setTimeout(() => { setActiveProduct(product); go("analysis"); }, 1400);
      } catch (e) {
        // backend not running — pick locally so the demo still works
        const pool = PRODUCTS.filter((p) => p.category === category || category === "cosmetics");
        const product = pool[Math.floor(Math.random() * pool.length)] || PRODUCTS[0];
        setTimeout(() => { setActiveProduct(product); go("analysis"); }, 1400);
      }
    })();
  };

  if (phase === "viewfinder" || phase === "invalidFramed" || phase === "invalidAlert" || phase === "analyzing") {
    const invalid = phase === "invalidFramed" || phase === "invalidAlert";
    return (
      <Screen bg="#15131c">
        <div style={{ flex: 1, position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{
            width: 210, height: 210, borderRadius: 12, overflow: "hidden",
            border: "2px solid rgba(255,255,255,0.5)",
            display: "flex", alignItems: "center", justifyContent: "center",
            background: invalid ? "linear-gradient(160deg,#6b5a4a,#3a2f26)" : "linear-gradient(160deg,#e8b7a0,#8a4a34)",
            filter: phase === "analyzing" ? "brightness(0.5)" : "none",
          }}>
            <span style={{ fontSize: 42 }}>{invalid ? "🪑" : "💄"}</span>
          </div>
          {phase === "analyzing" && (
            <div style={{ position: "absolute", background: "#fff", borderRadius: 14, padding: "18px 20px", textAlign: "center", width: 180 }}>
              <div style={{ fontSize: 20, marginBottom: 8 }}>🔎</div>
              <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 10 }}>Artificial intelligence reads the components</div>
              <div style={{ fontSize: 12, color: T.sub, cursor: "pointer" }} onClick={() => setPhase("idle")}>Cancel</div>
            </div>
          )}
          {phase === "invalidAlert" && (
            <Modal>
              <div style={{ color: T.redText, fontSize: 13, fontWeight: 600, marginBottom: 16 }}>
                Unfortunately, a non-product image was uploaded. Please re-upload a product image.
              </div>
              <button onClick={() => setPhase("viewfinder")} style={{ width: "100%", background: "none", border: "none", padding: "10px 0", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Upload</button>
              <button onClick={() => setPhase("idle")} style={{ width: "100%", background: "none", border: "none", padding: "8px 0", fontSize: 13, color: T.sub, cursor: "pointer" }}>Cancel</button>
            </Modal>
          )}
        </div>
        <div style={{ padding: "0 24px 28px", display: "flex", flexDirection: "column", alignItems: "center", gap: 16 }}>
          {phase === "invalidFramed" ? (
            <button onClick={() => setPhase("invalidAlert")} style={{ background: "#fff", border: "none", borderRadius: 999, padding: "9px 16px", fontSize: 12.5, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
              Upload From Gallery <Icon name="gallery" size={14} />
            </button>
          ) : (
            <button onClick={() => confirmShot(false)} style={{ background: "#fff", border: "none", borderRadius: 999, padding: "9px 16px", fontSize: 12.5, display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }}>
              Upload From Gallery <Icon name="gallery" size={14} />
            </button>
          )}
          <button onClick={() => confirmShot(true)} disabled={phase === "analyzing"} style={{ width: 62, height: 62, borderRadius: "50%", border: "3px solid #fff", background: phase === "analyzing" ? "#999" : "#fff", cursor: "pointer" }} />
        </div>
      </Screen>
    );
  }

  return (
    <Screen>
      <TopBar title="Smart scanning" onBack={() => go("allergy")} />
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
        <div style={{ width: "100%", maxWidth: 240, height: 160, border: `1.5px dashed ${T.line}`, borderRadius: 14, background: T.card, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 20 }}>
          <Icon name="camera" size={26} color={T.sub} />
          <div style={{ fontSize: 13, fontWeight: 600 }}>Scan Product</div>
          <div style={{ fontSize: 11, color: T.sub }}>Take a photo or upload from gallery</div>
        </div>
        <div style={{ display: "flex", gap: 10, width: "100%", maxWidth: 240 }}>
          <button onClick={startCapture} style={{ flex: 1, border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 0", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 12.5, cursor: "pointer" }}>
            <Icon name="camera" size={16} /> Camera
          </button>
          <button onClick={startCapture} style={{ flex: 1, border: `1px solid ${T.line}`, borderRadius: 10, padding: "10px 0", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontSize: 12.5, cursor: "pointer" }}>
            <Icon name="gallery" size={16} /> Gallery
          </button>
        </div>
      </div>
      <div style={{ padding: 22 }}>
        <GradientButton style={{ borderRadius: 999 }} onClick={startCapture}>continue</GradientButton>
      </div>
    </Screen>
  );
}

function Analysis({ go, product, allergyList }) {
  if (!product) return null;
  const result = AIEngine.checkProductSafety(product, allergyList);
  const ingredients = AIEngine.analyzeIngredients(product);
  return (
    <Screen>
      <TopBar title="Product analysis" onBack={() => go("scan")} />
      <div style={{ padding: 22, flex: 1, overflow: "auto" }}>
        <div style={{ fontSize: 44, textAlign: "center" }}>🧴</div>
        <div style={{ textAlign: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 16, fontWeight: 700 }}>{product.name}</div>
          <div style={{ fontSize: 12, color: T.sub }}>{product.brand}</div>
        </div>
        <div style={{
          padding: 14, borderRadius: 12, marginBottom: 18,
          background: result.safe ? T.green : T.red,
          border: `1px solid ${result.safe ? T.greenBorder : T.redBorder}`,
        }}>
          <div style={{ fontSize: 13.5, fontWeight: 700, color: result.safe ? T.greenText : T.redText }}>
            {result.safe ? "Safe for you" : `Contains ${result.flagged}`}
          </div>
          <div style={{ fontSize: 11.5, color: T.sub, marginTop: 3 }}>
            {result.safe ? "No known allergens detected" : "This ingredient is on your allergy list."}
          </div>
        </div>
        <div style={{ fontSize: 12, color: T.sub, marginBottom: 8 }}>Ingredients read from image</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 22 }}>
          {ingredients.map((ing) => (
            <span key={ing} style={{ fontSize: 11.5, padding: "5px 10px", borderRadius: 20, background: allergyList.includes(ing) ? T.redText : T.card, color: allergyList.includes(ing) ? "#fff" : T.ink }}>
              {ing}
            </span>
          ))}
        </div>
        <GradientButton style={{ borderRadius: 999 }} onClick={() => go("results")}>See alternatives</GradientButton>
      </div>
    </Screen>
  );
}

function Results({ go, product, allergyList, setActiveProduct, category }) {
  const [tab, setTab] = useState(category === "cosmetics" ? "cosmetics" : "skincare");
  const [showFilter, setShowFilter] = useState(false);
  const [filterType, setFilterType] = useState("all");

  const base = product || PRODUCTS[0];
  const alts = useMemo(() => {
    let list = AIEngine.getSuitableAlternatives(base, allergyList, filterType);
    if (filterType === "cheapest") list = [...list].sort((a, b) => a.price - b.price);
    return list;
  }, [base, allergyList, filterType]);

  return (
    <Screen>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px 10px" }}>
        <button onClick={() => go(product ? "analysis" : "scan")} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="back" /></button>
        <span style={{ fontSize: 14, fontWeight: 600 }}>Search results</span>
        <span style={{ width: 20 }} />
      </div>
      <div style={{ padding: "0 20px 8px", display: "flex", gap: 8, alignItems: "center" }}>
        <button onClick={() => setShowFilter(true)} style={{ display: "flex", alignItems: "center", gap: 4, border: `1px solid ${T.line}`, borderRadius: 20, padding: "6px 12px", background: "#fff", fontSize: 12, cursor: "pointer", position: "relative" }}>
          <Icon name="filter" size={14} /> Filter
          {filterType !== "all" && <span style={{ position: "absolute", top: -4, right: -4, width: 14, height: 14, borderRadius: "50%", background: T.redText, color: "#fff", fontSize: 9, display: "flex", alignItems: "center", justifyContent: "center" }}>1</span>}
        </button>
        {["skincare", "cosmetics"].map((c) => (
          <button key={c} onClick={() => setTab(c)} style={{
            borderRadius: 20, padding: "6px 14px", fontSize: 12, cursor: "pointer", border: "none",
            background: tab === c ? T.ink : T.card, color: tab === c ? "#fff" : T.ink,
          }}>
            {c === "skincare" ? "Skincare" : "Cosmetics"}
          </button>
        ))}
      </div>
      <div style={{ padding: "6px 20px 4px", fontSize: 12, color: T.sub }}>{alts.length} results found</div>
      <div style={{ padding: "0 20px 20px", flex: 1, overflow: "auto" }}>
        {alts.length === 0 && <div style={{ fontSize: 13, color: T.sub, marginTop: 30, textAlign: "center" }}>No safe alternatives found yet.</div>}
        {alts.map((p) => (
          <div key={p.id} onClick={() => { setActiveProduct(p); go("details"); }} style={{ display: "flex", gap: 12, padding: "12px 0", borderBottom: `1px solid ${T.line}`, cursor: "pointer" }}>
            <div style={{ width: 44, height: 44, borderRadius: 10, background: T.card, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, flexShrink: 0 }}>🧴</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{p.name}</div>
              <div style={{ fontSize: 11, color: T.sub }}>{p.brand} · SAR {p.price}{p.organic ? " · Organic" : ""}</div>
              <div style={{ display: "inline-flex", alignItems: "center", gap: 4, marginTop: 4, fontSize: 10.5, color: T.greenText }}>
                <Icon name="check" size={12} /> Safe for you
              </div>
            </div>
          </div>
        ))}
        {alts.length > 0 && (
          <button style={{ width: "100%", marginTop: 10, padding: "11px 0", borderRadius: 10, border: `1px solid ${T.line}`, background: "#fff", fontSize: 12.5, cursor: "pointer" }}>
            Load More Results
          </button>
        )}
      </div>
      {showFilter && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(20,16,35,0.4)", display: "flex", alignItems: "flex-end" }}>
          <Sheet title="Filter Results" onClose={() => setShowFilter(false)}>
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {["skincare", "cosmetics"].map((c) => (
                <button key={c} onClick={() => setTab(c)} style={{ borderRadius: 20, padding: "6px 14px", fontSize: 12, cursor: "pointer", border: "none", background: tab === c ? T.ink : T.card, color: tab === c ? "#fff" : T.ink }}>
                  {c === "skincare" ? "Skincare" : "Cosmetics"}
                </button>
              ))}
            </div>
            <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8 }}>Type</div>
            {[["cheapest", "Cheapest"], ["organic", "Organic"]].map(([key, label]) => (
              <label key={key} onClick={() => setFilterType(filterType === key ? "all" : key)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", cursor: "pointer" }}>
                <span style={{ width: 16, height: 16, borderRadius: "50%", border: `1.5px solid ${filterType === key ? T.purple : T.line}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {filterType === key && <span style={{ width: 8, height: 8, borderRadius: "50%", background: T.purple }} />}
                </span>
                <span style={{ fontSize: 13 }}>{label}</span>
              </label>
            ))}
            <div style={{ marginTop: 16 }}>
              <GradientButton style={{ borderRadius: 999 }} onClick={() => setShowFilter(false)}>Apply Filters</GradientButton>
            </div>
          </Sheet>
        </div>
      )}
      <BottomNav screen="results" go={go} />
    </Screen>
  );
}

function Details({ go, product, allergyList }) {
  if (!product) return null;
  const result = AIEngine.checkProductSafety(product, allergyList);
  return (
    <Screen>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px" }}>
        <button onClick={() => go("results")} style={{ background: "none", border: "none", cursor: "pointer" }}><Icon name="back" /></button>
        <span style={{ fontSize: 14, fontWeight: 600 }}>Search results</span>
        <span style={{ width: 20 }} />
      </div>
      <div style={{ padding: "10px 20px", flex: 1, overflow: "auto" }}>
        <div style={{ height: 150, borderRadius: 16, background: `linear-gradient(160deg, ${T.lavender}, #F3EEFF)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 46, marginBottom: 18 }}>
          🧴
        </div>
        <div style={{ fontSize: 12, color: T.sub }}>{product.brand}</div>
        <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 4 }}>{product.name}</div>
        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 14 }}>SAR {product.price}</div>

        {!result.safe ? (
          <div style={{ display: "flex", gap: 10, background: T.warnBg, border: `1px solid ${T.warnBorder}`, borderRadius: 12, padding: 12, marginBottom: 18 }}>
            <Icon name="warning" size={18} />
            <div style={{ fontSize: 12, color: T.warnText, lineHeight: 1.5 }}>
              Warning: This product contains {result.flagged}, which may cause irritation for sensitive users.
            </div>
          </div>
        ) : (
          <div style={{ display: "flex", gap: 8, alignItems: "center", background: T.green, border: `1px solid ${T.greenBorder}`, borderRadius: 12, padding: 12, marginBottom: 18 }}>
            <Icon name="check" size={16} />
            <div style={{ fontSize: 12, color: T.greenText, fontWeight: 600 }}>Safe for you — no known allergens detected.</div>
          </div>
        )}

        <div style={{ fontSize: 12, color: T.sub, marginBottom: 8 }}>Full ingredient list</div>
        <ul style={{ paddingLeft: 18, fontSize: 12.5, lineHeight: 1.9, margin: 0 }}>
          {product.ingredients.map((ing) => <li key={ing}>{ing}</li>)}
        </ul>
      </div>
      <BottomNav screen="results" go={go} />
    </Screen>
  );
}

function Profile({ go, user, onSignOut }) {
  const [editing, setEditing] = useState(false);
  return (
    <Screen>
      <LavenderHeader title="Profile" height={150} />
      <div style={{ flex: 1, position: "relative" }}>
        <Sheet title={editing ? "Edit Profile" : "Profile"} onClose={editing ? () => setEditing(false) : undefined}>
          {!editing ? (
            <>
              <div style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
                <div style={{ fontSize: 14, fontWeight: 700 }}>{user?.name || "Guest"}</div>
                <div style={{ fontSize: 12, color: T.sub }}>{user?.phone || "Not signed in"}</div>
              </div>
              <button onClick={() => setEditing(true)} style={{ width: "100%", textAlign: "left", background: "none", border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, fontSize: 13, marginBottom: 10, cursor: "pointer" }}>
                Edit profile
              </button>
              <button onClick={onSignOut} style={{ width: "100%", border: `1px solid ${T.line}`, borderRadius: 12, padding: "12px 0", background: "#fff", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, fontSize: 13, cursor: "pointer" }}>
                <Icon name="signout" size={16} /> sign out
              </button>
            </>
          ) : (
            <>
              {["Name", "Phone Number", "Password"].map((label) => (
                <div key={label} style={{ border: `1px solid ${T.line}`, borderRadius: 12, padding: 14, marginBottom: 12 }}>
                  <div style={{ fontSize: 11.5, color: T.sub, marginBottom: 4 }}>{label}</div>
                  <div style={{ fontSize: 13.5 }}>
                    {label === "Name" ? (user?.name || "—") : label === "Phone Number" ? (user?.phone || "—") : "••••••••••"}
                  </div>
                </div>
              ))}
            </>
          )}
        </Sheet>
      </div>
      <BottomNav screen="profile" go={go} />
    </Screen>
  );
}

/* ================= App shell ================= */

function App() {
  const [screen, setScreen] = useState("welcome");
  const [category, setCategory] = useState("skincare");
  const [allergyList, setAllergyList] = useState(["fragrance"]);
  const [activeProduct, setActiveProduct] = useState(null);
  const [user, setUser] = useState(null);

  const handleCreate = async (u) => {
    setUser(u);
    try {
      const allergies = await apiCall(`/api/allergies/${u.phone}`);
      if (Array.isArray(allergies) && allergies.length) setAllergyList(allergies);
    } catch (e) {
      // backend not running — local demo state stays as-is
    }
  };

  const handleSignOut = () => {
    setUser(null);
    setScreen("welcome");
  };

  const screens = {
    welcome: <Welcome go={setScreen} />,
    signin: <SignIn go={setScreen} onSignIn={handleCreate} />,
    signup: <SignUp go={setScreen} onCreate={handleCreate} />,
    forgot: <Forgot go={setScreen} />,
    verify: <Verify go={setScreen} />,
    reset: <Reset go={setScreen} />,
    category: <ChooseCategory go={setScreen} setCategory={setCategory} />,
    allergy: <SetAllergy go={setScreen} allergyList={allergyList} setAllergyList={setAllergyList} user={user} />,
    scan: <Scan go={setScreen} setActiveProduct={setActiveProduct} category={category} />,
    analysis: <Analysis go={setScreen} product={activeProduct} allergyList={allergyList} />,
    results: <Results go={setScreen} product={activeProduct} allergyList={allergyList} setActiveProduct={setActiveProduct} category={category} />,
    details: <Details go={setScreen} product={activeProduct} allergyList={allergyList} />,
    profile: <Profile go={setScreen} user={user} onSignOut={handleSignOut} />,
  };

  return (
    <div style={{ minHeight: "100vh", background: "#EDEAF6", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT }}>
      <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <div style={{ width: 360, height: 740, background: "#fff", borderRadius: 36, border: "10px solid #16131f", overflow: "hidden", position: "relative", boxShadow: "0 30px 60px rgba(0,0,0,0.3)" }}>
        {screens[screen]}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
